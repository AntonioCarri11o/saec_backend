spring.application.name=saec
# ====================================
# MySql
# ====================================
spring.datasource.url=jdbc:mysql://localhost:3306/SAEC?useSLL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ====================================
# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.quitwait=false
#esto desactiva el certificasdo
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.enable=false

# ====================================



# ====================================
# MongoDB
# ====================================
spring.data.mongodb.uri=mongodb://localhost:27017/SAEC_DB

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui/index.html
springdoc.paths-to-match=/api/**

server.port=8080

# ====================================
# JWT (Token de 1 dia)
# ====================================
security.jwt.key.private=SAEC.TEST.KEY
security.jwt.user.generator=SAEC.dev.issuer
security.jwt.expiration=86400000
